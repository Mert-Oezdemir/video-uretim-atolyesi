name: Blender and Higgsfield kit smoke tests
on:
  push:
    paths:
      - 'integrations/blender-higgsfield/**'
      - '.github/workflows/blender-higgsfield-smoke.yml'
  pull_request:
    paths:
      - 'integrations/blender-higgsfield/**'
      - '.github/workflows/blender-higgsfield-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python structure tests
        run: python -m unittest discover -s integrations/blender-higgsfield/tests -v
      - name: Bash syntax
        run: bash -n integrations/blender-higgsfield/scripts/install.sh
      - name: Browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('integrations/blender-higgsfield/web/index.html').read_text()
          script = page.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/blender-animation.js').write_text(script)
          PY
          node --check /tmp/blender-animation.js
